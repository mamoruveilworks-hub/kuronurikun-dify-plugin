identity:
  author: kuronurikun
  name: kuronurikun
  label:
    en_US: Kuronuri-kun (Japanese PII Masking)
    ja_JP: 個人情報黒塗りくん
    zh_Hans: Kuronuri-kun（日语个人信息脱敏）
  description:
    en_US: Mask personal information in Japanese text before sending it to an LLM, and restore it in the answer.
    ja_JP: 日本語の文章の個人情報を伏せてからLLMに渡し、回答を元の値に戻します。
    zh_Hans: 在发送给大模型之前遮蔽日语文本中的个人信息，并在回答中恢复。
  icon: icon.svg
  tags:
    - utilities
    - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      ja_JP: APIキー
      zh_Hans: API 密钥
    placeholder:
      en_US: pmk_...
      ja_JP: pmk_...
      zh_Hans: pmk_...
    help:
      en_US: Get a free API key (100,000 characters/month) at kuronurikun.com
      ja_JP: kuronurikun.com で無料のAPIキー（月10万文字まで）を発行できます
      zh_Hans: 在 kuronurikun.com 免费获取 API 密钥（每月 10 万字符）
    url: https://kuronurikun.com/#signup
tools:
  - tools/mask_pii.yaml
  - tools/unmask_pii.yaml
extra:
  python:
    source: provider/kuronurikun.py
